<style>
body {
  font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #ffffff;
  padding: 4vw;
  font-size: 4.5vw;
  line-height: 1.6;
}

/* Mobile-first (applies to phones/tablets) */
.subhead {
  font-size: 18px;    /* ↓ make this smaller if needed */
  line-height: 1.35;
  color: #555;
  max-width: 60ch;
  margin: 0.35em auto 0;
  text-align: center;
  text-wrap: balance;
}

/* Desktop / wide screens */
@media (min-width: 1000px) {
  .subhead {
    font-size: 20px;  /* desktop size */
    margin-top: 10px;
  }
}

.page-top {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 10px;
}
.logo-wrapper {
  display: flex;
  justify-content: center;
}
.title-wrapper {
  text-align: center;
}

.site-logo {
  width: 250px; /* ✅ Mobile-first: small logo */
  height: auto;
  flex-shrink: 0;
}

h1 {
  color: #333;
  font-size: 7vw;
  text-align: center;
  margin-bottom: 30px;
}
h2 {
  font-size: 5.5vw;
  color: #444;
  margin-top: 20px;
}
.cluster-block {
  background: white;
  border-radius: 10px;
  padding: 1.5em;
  margin-bottom: 40px;
}
.cluster-flex {
  display: flex;
  flex-direction: column;
  row-gap: 20px;
}
.left-column, .right-column {
  width: 100%;
}
.source-grid {
  background-color: #f0fdf4;
  padding: 1em;
  border-radius: 30px;
  margin-top: 1em;
}
.grid-container {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}
.source-entry {
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.2s ease;
}
.source-entry:hover {
  background-color: #f0f8ff;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
  border-radius: 8px;
}
.logo {
  width: 48px;
  height: 48px;
  object-fit: contain;
  border-radius: 4px;
  flex-shrink: 0;
  transition: transform 0.2s ease;
}
.logo:hover {
  transform: scale(1.05);
}
.source-text {
  display: flex;
  flex-direction: column;
  justify-content: center;
  line-height: 1.2;
}
.source-name {
  font-weight: 500;
  font-size: 0.85em;
  color: #333;
  margin-bottom: 2px;
}
.article-title a {
  font-size: 0.82em;
  color: #007BFF;
  text-decoration: none;
  font-weight: 500;
}
.article-title a:hover {
  text-decoration: underline;
}
.toc {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
  margin-bottom: 30px;
}
.toc-column {
  flex: 1;
  min-width: 250px;
  break-inside: avoid;
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.toc-category {
  margin-bottom: 2em;
}
.toc-category h2 {
  font-size: 1.2em;
  font-weight: 700;
  margin-bottom: 10px;
  color: #3CB371;
}
.toc-category a {
  display: block;
  text-decoration: none;
  color: black;
  margin-bottom: 20px;
  font-size: 1.2em;
}
.toc-category a:hover {
  text-decoration: underline;
}
.soft-bold {
  font-weight: 800;
  color: #111;
}

/* ===== Desktop (wide screen) adjustments ===== */
/* ===== Desktop (wide screen) adjustments ===== */
@media (min-width: 1000px) {
  body {
    font-size: 22px;
    padding: 30px;
  }

  /* Put logo top-left and push the title to its own full-width row */
  .page-top {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;               /* allow a second row */
    align-items: flex-start;
    justify-content: flex-start;   /* logo sits at top-left */
    gap: 10px 10px;
  }

  .logo-wrapper {
    display: flex;
    justify-content: flex-start;   /* don't center the logo on desktop */
    flex: 0 0 auto;                /* size to content, no stretching */
    order: 1;
  }

  .title-wrapper {
    flex: 1 1 100%;                /* force full width on the second line */
    order: 2;
    text-align: center;            /* center the title and timestamp */
    margin-top: 6px;
  }

  .site-logo {
    width: 150px;                  /* desktop: big logo */
  }

  h1 {
    font-size: 50px;
    text-align: center;
    margin: 0;
  }

  h2 {
    font-size: 30px;
  }

  .cluster-flex {
    flex-direction: row;
    column-gap: 80px;
  }

  .left-column, .right-column {
    width: 50%;
  }

  .grid-container {
    grid-template-columns: repeat(2, 1fr);
  }
}

</style>
